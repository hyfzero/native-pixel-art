[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "native-pixel-art"
version = "0.2.0"
description = "Deterministic native pixel-art compiler with strict size and palette validation"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "pydantic>=2.6,<3",
  "typer>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.68"]
dev = ["pytest>=8.0"]

[project.scripts]
pixel-art = "pixel_skill.cli:app"

[tool.setuptools.packages.find]
include = ["pixel_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
